[pytest]
# Добавляем src в путь, чтобы пакет rc_bench был доступен без отдельной установки.
pythonpath = src

# Включаем автоматическое определение асинхронных тестов
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Игнорируем лишние предупреждения (опционально, для чистоты вывода)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    integration: tests that require a running database (deselect with -m "not integration")
