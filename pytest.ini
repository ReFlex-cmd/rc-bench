[pytest]
# Добавляем src в путь, чтобы пакет rc_bench был доступен без отдельной установки.
pythonpath = src

# Неизвестная метка — ошибка: граница unit/integration должна оставаться явной.
addopts = --strict-markers

# Включаем автоматическое определение асинхронных тестов
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Игнорируем лишние предупреждения (опционально, для чистоты вывода)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    integration: tests that require PostgreSQL and Redis (select explicitly with -m "integration"; deselect with -m "not integration")
