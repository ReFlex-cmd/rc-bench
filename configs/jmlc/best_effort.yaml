# JMLC best-effort matrix config (§2 описания проекта).
#
# Fair-режим отвечает на вопрос «какая архитектура лучше при равных условиях».
# Best-effort отвечает на другой: «чего каждая архитектура достигает, когда её
# настраивают ради результата». Числа двух режимов НИКОГДА не попадают в одну
# таблицу — бандл держит их в отдельных каталогах и отдельных агрегатах, а
# режим записан в протоколе каждой ячейки, так что перепутать их постфактум
# нельзя.
#
# Что здесь индивидуально, а что нет: индивидуален только HPO-бюджет.
# Пространства поиска остаются общими (rc_bench/hpo/search_spaces.py), seed'ы,
# датасет, split и правила отбора — те же, что в fair. Это осознанное
# ограничение: оно оставляет режим сопоставимым с fair по всему, кроме
# вычислительного бюджета, и оно названо в README бандла.
#
# Бюджеты подобраны по стоимости ячейки в fair-прогоне (самая тяжёлая, LSM,
# заняла 21 с на 20 trials x 5 seeds), поэтому весь прогон остаётся в пределах
# примерно 15 минут машинного времени.
dataset:
  name: uci_household_power
  length: 12000
  # Пиннится к configs/jmlc/dataset_manifest.json raw_file.sha256; run_matrix
  # хеширует сырой файл перед прогоном и отказывается считать при расхождении.
  raw_sha256: 4259c9d7ece5dbee9ab8d53682baac68d791c864f0f64a52b4043cb3b90894b7
reservoir:
  type: esn
  params: {}
matrix:
  # Режим продублирован ниже, в protocol.mode: блок matrix читает раннер, а
  # protocol видит `rcbench validate-spec`. Расхождение между ними раннер
  # отвергает — иначе валидатор докладывал бы про шаблон не то, что будет
  # исполнено.
  mode: best_effort
  budgets:
    esn: 60
    leaky_esn: 60
    logistic: 60
    lsm: 40
protocol:
  washout: 200
  train_frac: 0.6
  val_frac: 0.2
  forecasting_mode: fixed_horizon
  horizon: 1
  use_hpo: true
  hpo_budget: 60          # для reservoir-моделей без своей строки в budgets
  n_seeds: 5
  selection_metric: nrmse_std
  seasonal_period: 24
  mode: best_effort
readout:
  alpha_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
seed: 42
