services:
  # -----------------------------------------------------------------
  # DATABASE (PostgreSQL)
  # -----------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: rc_bench_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # CACHE (Redis)
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rc_bench_redis
    restart: always
    ports:
      - "6379:6379"

  # -----------------------------------------------------------------
  # API SERVER (FastAPI)
  # -----------------------------------------------------------------
  api:
    build: .             # Строим из текущей папки (Dockerfile)
    container_name: rc_bench_api
    restart: always
    command: uvicorn rc_bench.main:app --host 0.0.0.0 --port 8000
    # ports:
    #   - "8000:8000"
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy # Ждем, пока база скажет "Я готова"
      redis:
        condition: service_started

  # -----------------------------------------------------------------
  # WORKER (Celery)
  # -----------------------------------------------------------------
  worker:
    build: .             # Используем тот же образ, что и для API
    container_name: rc_bench_worker
    restart: always
    # Запускаем Celery
    command: celery -A rc_bench.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started


  # -----------------------------------------------------------------
  # WEB SERVER (Nginx)
  # -----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: rc_bench_nginx
    restart: always
    ports:
      - "80:80" # Открываем стандартный HTTP порт
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
