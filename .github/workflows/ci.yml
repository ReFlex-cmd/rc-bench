name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python 3.12 unit gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.3.1"

      - name: Install locked dependencies
        run: poetry install --no-interaction --only main,test

      - name: Run unit gate and CLI smoke
        run: bash scripts/verify.sh quick
