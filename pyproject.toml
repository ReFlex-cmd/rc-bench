[project]
name = "rc-bench"
version = "0.1.0"
description = ""
authors = [
    {name = "ReFlex"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "typer[all] (>=0.20.0,<0.21.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "reservoirpy (>=0.4.1,<0.5.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "celery[redis] (>=5.6.2,<6.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "argon2-cffi (>=25.1.0,<26.0.0)"
]

[project.scripts]
rcbench = "orchestrator.cli:app"

[tool.poetry]
packages = [
  { include = "rc_bench", from = "src" },    
  { include = "orchestrator" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
dev = [
    "ansible (>=13.2.0,<14.0.0)"
]
